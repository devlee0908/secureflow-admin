services:
  secureflow-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secureflow-enterprise-admin
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - KMS_PROVIDER=${KMS_PROVIDER:-software-hsm}
      - SECUREFLOW_MASTER_KEK=${SECUREFLOW_MASTER_KEK:-}
      - JWT_SIGNING_SECRET=${JWT_SIGNING_SECRET:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-secureflow-secret-key-2026}
    volumes:
      - secureflow_data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  secureflow_data:
    driver: local
