name: SecureFlow DevSecOps Governance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-build-gate:
    name: Zero-Trust Security Suite & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (Native SQLite & Crypto)
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install Dependencies (Deterministic Lockfile)
        run: npm ci

      - name: Run Cryptographic & Zero-Trust Security Test Suite
        run: npm test

      - name: Verify TypeScript & Production Bundle Build
        run: npm run build
